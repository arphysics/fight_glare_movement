name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement lets the workflow create the Pages site itself, so this
      # doesn't require flipping Settings -> Pages -> Source by hand first
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The artifact is the repo root, so anything tracked here is published at
      # fightglare.org/<name>. Strip the files that are for contributors, not
      # visitors, before uploading. This only touches the runner's checkout —
      # the files stay in git, and the Cloudflare build is unaffected.
      - name: Keep contributor docs out of the published site
        run: rm -f todo.txt CLAUDE.md EDITING.md launch-claude.sh bootstrap-claude-sandbox.sh

      # Fail loudly rather than deploying a site with no page in it
      - name: Verify the site itself survived
        run: test -f index.html && test -f CNAME && test -f assets/owl-logo.png

      # No build step — the site is plain HTML/CSS/JS served from the repo root
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
