<!DOCTYPE html>
<!--
  Source for assets/og-image.png — the 1200x630 social share card.

  REGENERATE (from the repo root, on a machine that can reach Google Fonts):
    python3 -m http.server 8000
    # then, in a browser at http://localhost:8000/assets/og-card.html,
    # screenshot at exactly 1200x630 — or with Playwright:
    #   npx playwright screenshot --viewport-size=1200,630 \
    #     http://localhost:8000/assets/og-card.html assets/og-image.png

  The committed PNG was rendered where webfonts were unreachable, so its
  headline is a Georgia fallback rather than Fraunces. Regenerating on a
  normal machine fixes that. Social platforms cache scraped cards for a
  long time, so do it before sharing the link widely.
-->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Lexend:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#2a2f3e;overflow:hidden;position:relative;
       font-family:'Lexend',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .stars{position:absolute;inset:0;background-image:
    radial-gradient(1.6px 1.6px at 18% 24%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.2px 1.2px at 72% 16%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.6px 1.6px at 88% 62%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.2px 1.2px at 36% 78%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.2px 1.2px at 58% 44%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.6px 1.6px at 8% 66%,rgba(255,255,255,.4),transparent);
    background-repeat:repeat;background-size:600px 600px}
  .wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 470px;
        align-items:center;gap:40px;padding:0 72px}
  .eyebrow{font-family:'Fraunces',Georgia,serif;text-transform:uppercase;letter-spacing:2.4px;
           font-size:19px;font-weight:600;color:#e9ac5c;margin-bottom:22px}
  h1{font-family:'Fraunces',Georgia,serif;font-size:78px;line-height:1.06;font-weight:700;
     letter-spacing:-0.5px;color:#e9ac5c}
  p{margin-top:26px;font-size:26px;line-height:1.5;color:#c8bbaa;max-width:20ch}
  .url{position:absolute;left:72px;bottom:52px;font-size:23px;color:#efe7da;letter-spacing:.4px}
  .owl{width:100%;filter:saturate(1.02)}
  .glow{position:absolute;right:118px;top:50%;transform:translateY(-50%);width:400px;height:400px;
        border-radius:50%;background:radial-gradient(circle,rgba(233,172,92,.30),transparent 68%);filter:blur(20px)}
</style></head><body>
<div class="stars"></div><div class="glow"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Irvine &amp; Orange County, CA</div>
    <h1>Irvine, let's<br>fight glare!</h1>
    <p>Warmer, shielded streetlights that are easy on the eyes.</p>
  </div>
  <img class="owl" src="owl-logo.png" alt="">
</div>
<div class="url">fightglare.org</div>
</body></html>
